<div th:fragment="hero">
    <div class="hero position-relative">
        <nav class="navbar navbar-expand-lg w-100 position-absolute top-0 start-0 z-3 p-3">
            <div class="container">
                <a class="navbar-brand fw-bold" style="font-family: 'League Script', cursive; font-size: 2rem; color: #2f2a28;" href="/home">HOME</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
                    <ul class="navbar-nav align-items-center gap-4">
                        <li class="nav-item" th:unless="${hideAllRooms == true}">
                            <a class="nav-link text-uppercase" style="color: #5a514d; letter-spacing: 0.1em; font-size: 0.85rem; font-weight: 500; transition: color 0.2s ease;" href="/home" onmouseover="this.style.color='#a67b6b'" onmouseout="this.style.color='#5a514d'">View All Rooms</a>
                        </li>
                        <li class="nav-item" th:unless="${hideSearch == true}">
                            <a class="nav-link text-uppercase" style="color: #5a514d; letter-spacing: 0.1em; font-size: 0.85rem; font-weight: 500; transition: color 0.2s ease;" href="/search" onmouseover="this.style.color='#a67b6b'" onmouseout="this.style.color='#5a514d'">Search Dates</a>
                        </li>
                        <li class="nav-item ms-2" th:unless="${hideLogin == true}">
                            <a class="nav-link text-uppercase" style="color: #5a514d; letter-spacing: 0.1em; font-size: 0.85rem; font-weight: 500; border: 1px solid rgba(166, 123, 107, 0.6); border-radius: 20px; padding: 6px 18px; transition: all 0.2s ease;" href="/customer" onmouseover="this.style.backgroundColor='#a67b6b'; this.style.color='white'; this.style.borderColor='#a67b6b';" onmouseout="this.style.backgroundColor='transparent'; this.style.color='#5a514d'; this.style.borderColor='rgba(166, 123, 107, 0.6)';">Login / Profile</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>

        <div class="hero-content mt-5">
            <h1 class="header-title">L'Hôtel de Ville</h1>
            <p class="subtitle">Bed & Breakfast</p>
        </div>
    </div>
</div>

version: '3.8'
services:
  booking-db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: bookify
      MYSQL_ROOT_PASSWORD: root
    ports:
      - '3306:3306'
  customer-db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: customerDB
      MYSQL_ROOT_PASSWORD: root
    ports:
      - '3307:3306'
  booking-service:
    build: ./booking-service
    ports:
      - '8080:8080'
    depends_on:
      - booking-db
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://booking-db:3306/bookify?serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root
  customer-service:
    build: ./customer-service
    ports:
      - '8081:8081'
    depends_on:
      - customer-db
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://customer-db:3306/customerDB?serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root

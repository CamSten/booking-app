<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>
<div class="popup" id="LoginPopup">
    <div class="popupContent" id="popupBox">
        <form id="LoginForm">
            <h1>Login</h1>
            <div id="loginError" class="hidden">
                Missing information
            </div>
            <div class="formGroup">
                <label for="loginemail">Email address</label>
                <br>
                <input type="text" class="formControl inputBase" id="loginemail" placeholder="Enter email" required>
                <br>
                <small class="errorMessage"></small>
            </div>
            <br>
            <div class="formGroup">
                <label for="loginpassword">Password</label>
                <br>
                <input type="text" class="formControl inputBase" id="loginpassword" placeholder="Enter password" required>
                <br>
                <small class="errorMessage"></small>
            </div>
            <br>
            <button type="login" class="loginButton">Log in</button>
            <button type="signupre" class="signupReButton">Sign up</button>
        </form>
        <form id="SignupForm">
            <h1>Sign Up</h1>
            <div id="signupError" class="hidden">
                Missing information
            </div>
            <div class="formGroup">
                <label for="name">Full name</label>
                <br>
                <input type="text" class="formControl inputBase" id="name" placeholder="Enter full name" required>
                <br>
                <small class="errorMessage"></small>
            </div>
            <br>
            <div class="formGroup">
                <label for="signupemail">Email address</label>
                <br>
                <input type="text" class="formControl inputBase" id="signupemail" placeholder="Enter email" required>
                <br>
                <small class="errorMessage"></small>
            </div>
            <br>
            <div class="formGroup">
                <label for="phone">Phone number</label>
                <br>
                <input type="text" class="formControl inputBase" id="phone" placeholder="Enter phone number" required>
                <br>
                <small class="errorMessage"></small>
            </div>
            <br>
            <div class="formGroup">
                <label for="address">Address</label>
                <br>
                <input type="text" class="formControl inputBase" id="address" placeholder="Enter address" required>
                <br>
                <small class="errorMessage"></small>
            </div>
            <br>
            <div class="formGroup">
                <label for="signuppassword">Password</label>
                <br>
                <input type="text" class="formControl inputBase" id="signuppassword" placeholder="Enter postal number" required>
                <br>
                <small class="errorMessage"></small>
            </div>
            <button type="signup" class="signupButton">Sign up</button>
        </form>
        <div>
            <button type="button" id="closeButton">Close</button>
        </div>
    </div>
</div>

</body>
</html>

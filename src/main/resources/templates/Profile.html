<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head}"></head>
<body>
    <div th:replace="~{fragments/hero :: hero(hideLogin=true)}"></div>

<div class="container my-5">
    <div class="row justify-content-center mb-5">
        <div class="col-12 col-md-8">
            <div class="booking-card text-center">
                <h2 class="mb-4" style="font-family: 'Playfair Display', serif; color: #5f4b45;">Customer Profile</h2>
                
                <input type="hidden" id="customer-id" th:value="${customer.id}">
                
                <div class="row text-start justify-content-center mt-4">
                    <div class="col-6 col-md-4 mb-3">
                        <strong style="color: #a67b6b; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.1em;">Name</strong>
                        <p class="m-0" style="color: #5a514d; font-size: 1.1rem;" th:text="${customer.name}"></p>
                    </div>
                    <div class="col-6 col-md-4 mb-3">
                        <strong style="color: #a67b6b; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.1em;">Email</strong>
                        <p class="m-0" style="color: #5a514d; font-size: 1.1rem;" th:text="${customer.email}"></p>
                    </div>
                    <div class="col-6 col-md-4 mb-3">
                        <strong style="color: #a67b6b; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.1em;">Phone</strong>
                        <p class="m-0" style="color: #5a514d; font-size: 1.1rem;" th:text="${customer.phone}"></p>
                    </div>
                    <div class="col-12 mb-4 text-center mt-3">
                        <strong style="color: #a67b6b; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.1em;">Address</strong>
                        <p class="m-0" style="color: #5a514d; font-size: 1.1rem;" th:text="${customer.address}"></p>
                    </div>
                </div>

                <div class="d-flex justify-content-center gap-3 mt-4 flex-wrap">
                    <form th:action="@{/profile/edit}" method="get">
                        <button type="submit" class="modal-btn modal-btn-secondary">Edit Profile</button>
                    </form>
                    <form th:action="@{/logout}" method="get">
                        <button type="submit" class="modal-btn modal-btn-secondary" style="background: #e6e2df;">Logout</button>
                    </form>
                    <form th:action="@{/profile/delete}" method="post">
                        <button type="submit" class="modal-btn modal-btn-danger" onclick="return confirm('Are you sure you want to delete your account?')">Delete Account</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="booking-view-card bookings-section">
    <h2 id="bookings-header">Upcoming Bookings</h2>
    <p class="bookings-subtitle">
        View and manage your upcoming stays.
    </p>
    <table class="table" id="bookings-table">
        <thead>
        <tr>
            <th></th>
            <th>Check-in</th>
            <th>Check-out</th>
            <th>Guests</th>
            <th>Total Price</th>
            <th></th>
        </tr>
        </thead>
        <tbody id="bookings-container">

        </tbody>
    </table>
</div>

    <div th:replace="~{fragments/modal :: modal}"></div>


<script th:src="@{/js/profileBookings.js}"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
</body>
</html>

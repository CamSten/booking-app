<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
            href="https://fonts.googleapis.com/css2?family=League+Script&display=swap"
            rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/tempStyle.css}">
    <title>Profile</title>
</head>
<body>
<h1>Customer Profile</h1>

<div>
    <input type="hidden"
           id="customer-id"
           th:value="${customer.id}">
    <p>
        <strong>Name:</strong>
        <span th:text="${customer.name}"></span>
    </p>
    <p>
        <strong>Email:</strong>
        <span th:text="${customer.email}"></span>
    </p>
    <p>
        <strong>Phone:</strong>
        <span th:text="${customer.phone}"></span>
    </p>
    <p>
        <strong>Address:</strong>
        <span th:text="${customer.address}"></span>
    </p>
</div>



<div class="booking-view-card bookings-section">
    <h2 id="bookings-header">Upcoming Bookings</h2>
    <p class="bookings-subtitle">
        View and manage your upcoming stays.
    </p>
    <table class="table" id="bookings-table">
        <thead>
        <tr>
            <th></th>
            <th>Check-in</th>
            <th>Check-out</th>
            <th>Guests</th>
            <th>Total Price</th>
            <th></th>
        </tr>
        </thead>
        <tbody id="bookings-container">

        </tbody>
    </table>
    <br>
    <form th:action="@{/logout}" method="get">
        <button type="submit">
            Logout
        </button>
    </form>

    <br>
    <form th:action="@{/profile/edit}" method="get">
        <button type="submit">
            Edit Profile
        </button>
    </form>

    <br>
    <form th:action="@{/profile/delete}" method="post">
        <button type="submit" onclick="return confirm('Are you sure you want to delete your account?')">
            Delete Account
        </button>
    </form>
</div>

    <div th:replace="~{fragments/modal :: modal}"></div>


<script th:src="@{/js/profileBookings.js}"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
</body>

</html>

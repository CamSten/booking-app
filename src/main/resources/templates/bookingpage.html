<!DOCTYPE html>
<html lang="en">
<head th:replace="~{fragments/head :: head}"></head>

<body>
<div th:replace="~{fragments/hero :: hero}"></div>

<div class="booking-container container my-5">
    <div class="row g-4">
        <div th:replace="~{fragments/calendarCard :: calendarCard}"></div>
        <div class="col-12 col-lg-6">
            <div class="booking-card">
                <input type="hidden"
                       id="booking-id"
                       th:value="${bookingId}">
                <input type="hidden"
                       id="room-id"
                       th:value="${room.id}">

                <input type="hidden"
                       id="room-price"
                       th:value="${room.costPerNight}">
                <img id="room-image"
                     th:src="@{'/images/rooms/room_' + ${room.id} + '_1.jpg'}"
                     alt="Room image">

                <h2 th:text="${room.roomType} + ' Room'">Room Type</h2>

                <p>
                    <strong>Price per night:</strong>
                    <span th:text="${room.costPerNight} + ' SEK'">0 SEK</span>
                </p>

                <p>
                    <strong>Room number:</strong>
                    <span th:text="${room.roomNumber}">101</span>
                </p>

                <div id="extra-bed-section"
                     th:if="${room.extraBedAvailable}">
                    <label>
                        <input type="checkbox" id="extra-bed">
                        Extra bed
                    </label>
                </div>

                <div id="guest-section" style="display:none;">
                    <label id = "guestlabel">Guests:</label>
                </div>

                <p>
                    <strong>Dates:</strong>
                    <span id="booking-dates">Not selected</span>
                </p>

                <p>
                    <strong>Total price:</strong>
                    <span id="booking-total">0 SEK</span>
                </p>

                <button class="book-btn"
                        id="book-button"
                        style="display:none;">
                    Book this room
                </button>
                
                <a class="btn btn-outline-secondary w-100 mt-2" style="border-radius: 12px; padding: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.1em;" href="/home">
                    Back to All Rooms
                </a>

            </div>
        </div>

    </div>
</div>

<div th:replace="~{fragments/modal :: modal}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
<script th:src="@{/js/booking.js?v=2}"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Homepage</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <link href="https://fonts.googleapis.com/css2?family=League+Script&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/tempStyle.css}">
</head>
<body>
    <div th:replace="~{fragments/hero :: hero(hideAllRooms=true)}"></div>

    <main class="container mt-5">
        <div class="row g-4">
            <div class="col-12 col-md-3" th:each="room : ${rooms}">
                <a th:href="@{/room(id=${room.id})}" class="text-decoration-none text-dark">
                    <div class="card h-100 shadow-sm border-0">
                        <img th:src="@{'/images/rooms/room_' + ${room.id} + '_1.jpg'}" 
                             class="card-img-top" 
                             alt="Hotel Room" 
                             style="height: 200px; object-fit: cover;">
                        <div class="card-body text-center">
                            <h5 class="fw-bold mb-1" th:text="'Room ' + ${room.roomNumber}"></h5>
                            <p class="text-muted mb-0" th:text="${room.roomType}"></p>
                        </div>
                    </div>
                </a>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

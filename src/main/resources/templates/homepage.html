<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Homepage</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <link href="https://fonts.googleapis.com/css2?family=League+Script&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/tempStyle.css}">
</head>
<body>
    <header class="d-flex justify-content-between align-items-center p-3 border-bottom shadow-sm">
        <div style="width: 120px;"></div>
        <h1 class="m-0 fw-bold" style="font-family: 'League Script', cursive; font-size: 3rem;">HOME</h1>
        <a href="/login" class="btn btn-primary" style="width: 120px;">Login/profile</a>
    </header>

    <main class="container mt-5">
        <div class="row g-4">
            <!-- Thymeleaf loop starts here -->
            <div class="col-12 col-md-3" th:each="room : ${rooms}">
                <div class="card h-100 shadow-sm border-0">
                    <img th:src="${room.roomType == 'Single' ? '/images/single_room.png' : '/images/double_room.png'}" 
                         class="card-img-top" 
                         alt="Hotel Room" 
                         style="height: 200px; object-fit: cover;">
                    <div class="card-body text-center">
                        <h5 class="fw-bold mb-1" th:text="'Room ' + ${room.roomNumber}"></h5>
                        <p class="text-muted mb-0" th:text="${room.roomType}"></p>
                    </div>
                </div>
            </div>
            <!-- Thymeleaf loop ends here -->
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

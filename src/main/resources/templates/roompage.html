<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Room Details</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <link href="https://fonts.googleapis.com/css2?family=League+Script&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div th:replace="~{fragments/hero :: hero}"></div>

    <main class="container mt-5">
        <div class="row bg-light p-4 rounded shadow-sm">
            <div class="col-12 col-md-6 mb-4 mb-md-0">
                <div id="roomCarousel" class="carousel slide" data-bs-ride="carousel">
                    <div class="carousel-inner rounded shadow-sm">
                        <div class="carousel-item active">
                            <img th:src="@{'/images/rooms/room_' + ${room.id} + '_1.jpg'}" class="d-block w-100" alt="Room Image 1">
                        </div>
                        <div class="carousel-item">
                            <img th:src="@{'/images/rooms/room_' + ${room.id} + '_2.jpg'}" class="d-block w-100" alt="Room Image 2">
                        </div>
                        <div class="carousel-item">
                            <img th:src="@{'/images/rooms/room_' + ${room.id} + '_3.jpg'}" class="d-block w-100" alt="Room Image 3">
                        </div>
                    </div>
                    <button class="carousel-control-prev" type="button" data-bs-target="#roomCarousel" data-bs-slide="prev">
                        <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                        <span class="visually-hidden">Previous</span>
                    </button>
                    <button class="carousel-control-next" type="button" data-bs-target="#roomCarousel" data-bs-slide="next">
                        <span class="carousel-control-next-icon" aria-hidden="true"></span>
                        <span class="visually-hidden">Next</span>
                    </button>
                </div>
            </div>
            
            <div class="col-12 col-md-6 d-flex flex-column justify-content-center">
                <h2 class="fw-bold mb-3" th:text="'Room ' + ${room.roomNumber}">Room 101</h2>
                <div class="fs-5 mb-2">
                    <span class="fw-bold">Type:</span> <span th:text="${room.roomType}">Single</span>
                </div>
                <div class="fs-5 mb-4">
                    <span class="fw-bold">Extra Bed Available:</span> <span th:text="${room.extraBedAvailable ? 'Yes' : 'No'}">No</span>
                </div>
                <p class="text-muted mb-5">
                    A beautiful and cozy room perfect for your stay. Features a stunning view and comfortable amenities.
                </p>
                <a th:href="@{/book(roomId=${room.id})}" class="book-btn text-center text-decoration-none mt-4">Book Now</a>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

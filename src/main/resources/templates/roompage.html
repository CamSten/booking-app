<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Room Details</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=League+Script&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/hero :: hero}"></div>

<main class="container my-5">
    <div class="row justify-content-center">
        <div class="col-12 col-lg-10">
            <div class="booking-card">

                <div class="row g-4">

                    <div class="col-12 col-md-6">
                        <div id="roomCarousel" class="carousel slide" data-bs-ride="carousel">
                            <div class="carousel-inner rounded shadow-sm">

                                <div class="carousel-item active">
                                    <img th:src="@{'/images/rooms/room_' + ${room.id} + '_1.jpg'}"
                                         class="d-block w-100"
                                         alt="Room Image 1">
                                </div>

                                <div class="carousel-item">
                                    <img th:src="@{'/images/rooms/room_' + ${room.id} + '_2.jpg'}"
                                         class="d-block w-100"
                                         alt="Room Image 2">
                                </div>

                                <div class="carousel-item">
                                    <img th:src="@{'/images/rooms/room_' + ${room.id} + '_3.jpg'}"
                                         class="d-block w-100"
                                         alt="Room Image 3">
                                </div>

                            </div>
                        </div>
                    </div>

                    <div class="col-12 col-md-6 d-flex flex-column justify-content-center">

                        <h2 class="room-title" th:text="'Room ' + ${room.roomNumber}">
                            Room 101
                        </h2>

                        <div class="mb-3">
                            <span class="room-label">Type:</span>
                            <span class="room-text" th:text="${room.roomType}"></span>
                        </div>

                        <div class="mb-4">
                            <span class="room-label">Extra Bed:</span>
                            <span class="room-text"
                                  th:text="${room.extraBedAvailable ? 'Yes' : 'No'}"></span>
                        </div>

                        <p class="room-text mb-4">
                            A beautiful and cozy room perfect for your stay.
                        </p>

                        <a th:href="@{/book(roomId=${room.id})}"
                           class="book-btn text-center text-decoration-none">
                            Book Now
                        </a>

                    </div>

                </div>
            </div>
        </div>
    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

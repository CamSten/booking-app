<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Room Details</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <link href="https://fonts.googleapis.com/css2?family=League+Script&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/tempStyle.css}">
</head>
<body>
    <header class="d-flex justify-content-between align-items-center p-3 border-bottom shadow-sm">
        <a href="/" class="btn btn-outline-secondary" style="width: 120px;">Back</a>
        <h1 class="m-0 fw-bold" style="font-family: 'League Script', cursive; font-size: 3rem;">ROOM DETAILS</h1>
        <a href="/login" class="btn btn-primary" style="width: 120px;">Login/profile</a>
    </header>

    <main class="container mt-5">
        <div class="row bg-light p-4 rounded shadow-sm">
            <div class="col-12 col-md-6 mb-4 mb-md-0">
                <img src="/images/peonies.jpg" class="img-fluid rounded" alt="Room View">
            </div>
            
            <div class="col-12 col-md-6 d-flex flex-column justify-content-center">
                <h2 class="fw-bold mb-3">Room 101</h2>
                <div class="fs-5 mb-2">
                    <span class="fw-bold">Type:</span> Single
                </div>
                <div class="fs-5 mb-4">
                    <span class="fw-bold">Extra Bed Available:</span> No
                </div>
                <p class="text-muted mb-5">
                    A beautiful and cozy room perfect for your stay. Features a stunning view and comfortable amenities.
                </p>
                <a href="/book" class="btn btn-success btn-lg w-100">Book Now</a>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
